name: Deploy Azure Local Docs to GitHub Pages

on:
  push:
    paths-ignore:
      - 'Readme.md'
    branches: [main]

  workflow_dispatch: # Allow manual triggering from the Actions tab.

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Every toolkit path written on the site must exist in the toolkit (owner rule D19).
  toolkit-links:
    uses: ./.github/workflows/check-toolkit-links.yml

  deploy:
    needs: toolkit-links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Check formatting with Prettier
        run: npx prettier --check "src/**/*.{js,jsx,json,css,md}"

      - name: Lint docs with Vale
        uses: errata-ai/vale-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: docs
          reporter: github-check

      - name: Build site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
